<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="sky" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#2a3f78"/>
      <stop offset="0.6" stop-color="#15234a"/>
      <stop offset="1" stop-color="#0a1330"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fbeec4"/>
      <stop offset="0.45" stop-color="#e2bd6f"/>
      <stop offset="1" stop-color="#a97d32"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99a45"/>
      <stop offset="0.5" stop-color="#f6e2a8"/>
      <stop offset="1" stop-color="#c99a45"/>
    </linearGradient>
    <clipPath id="globe"><circle cx="128" cy="134" r="54"/></clipPath>
    <!-- the orbit is split: the far half is drawn behind the globe, the near half in front -->
    <clipPath id="far"><rect x="0" y="0" width="256" height="134" transform="rotate(-18 128 134)"/></clipPath>
    <clipPath id="near"><rect x="0" y="134" width="256" height="140" transform="rotate(-18 128 134)"/></clipPath>
  </defs>

  <circle cx="128" cy="128" r="120" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f6e2a8">
    <path d="M190 58 L193 69 L204 72 L193 75 L190 86 L187 75 L176 72 L187 69 Z" opacity="0.95"/>
    <circle cx="64" cy="76" r="3" opacity="0.7"/>
    <circle cx="80" cy="200" r="2.4" opacity="0.5"/>
    <circle cx="206" cy="170" r="2.2" opacity="0.55"/>
  </g>

  <!-- far half of the orbit -->
  <ellipse cx="128" cy="134" rx="98" ry="30" fill="none" stroke="url(#ring)" stroke-width="7"
           transform="rotate(-18 128 134)" clip-path="url(#far)" opacity="0.75"/>

  <!-- the small world -->
  <circle cx="128" cy="134" r="54" fill="url(#gold)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#5b3f12" stroke-opacity="0.38" stroke-width="3.2">
    <ellipse cx="128" cy="134" rx="22" ry="54"/>
    <line x1="128" y1="78" x2="128" y2="190"/>
    <line x1="70" y1="134" x2="186" y2="134"/>
    <ellipse cx="128" cy="106" rx="54" ry="8"/>
    <ellipse cx="128" cy="162" rx="54" ry="8"/>
  </g>

  <!-- near half of the orbit, with a satellite -->
  <ellipse cx="128" cy="134" rx="98" ry="30" fill="none" stroke="url(#ring)" stroke-width="7"
           transform="rotate(-18 128 134)" clip-path="url(#near)"/>
  <circle cx="64" cy="181" r="8" fill="#fbeec4"/>
</svg>
